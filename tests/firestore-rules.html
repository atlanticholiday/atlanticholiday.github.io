<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Firestore rules pending</title></head>
<body>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import {
  collection, connectFirestoreEmulator, deleteDoc, doc, FieldPath, getDoc, getDocs,
  getFirestore, query, serverTimestamp, updateDoc, where, writeBatch
} from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

const projectId = 'demo-horario';
const emulatorPort = Number.parseInt(new URLSearchParams(window.location.search).get('firestorePort') || '8080', 10);
const now = new Date();
const epoch = now.getTime();
const dateKey = now.toISOString().slice(0, 10);

function client(name, token) {
  const app = initializeApp({ projectId, apiKey: 'demo-key', appId: `demo-${name}` }, name);
  const db = getFirestore(app);
  connectFirestoreEmulator(db, '127.0.0.1', emulatorPort, { mockUserToken: token });
  return db;
}

function canonicalData({ id, recordId, employeeId = 'emp-1', category = 'attendance', action, eventType = null, targetEventId = null, reason = null, source = 'web', actorUid = null, actorEmail = null, eventEpochMs = epoch }) {
  const privilegedAction = action === 'manual-punch' || action === 'authorized';
  return {
    id, recordId, employeeId, dateKey, category, action, eventType, targetEventId,
    reason, source, actorUid: actorUid || (privilegedAction ? 'admin-uid' : 'worker-uid'),
    actorEmail: actorEmail || (privilegedAction ? 'admin@example.com' : 'worker@example.com'),
    occurredAt: eventType ? `${dateKey}T09:00:00` : null,
    occurredAtEpochMs: eventType && source !== 'manual' ? eventEpochMs : null,
    serverRecordedAt: serverTimestamp(), schemaVersion: 1
  };
}

async function expectDenied(operation, label) {
  try {
    await operation();
    throw new Error(`${label}: operation unexpectedly succeeded`);
  } catch (error) {
    if (String(error?.message || '').includes('unexpectedly succeeded')) throw error;
  }
}

async function run() {
  let stage = 'initialize';
  try {
  const workerDb = client('worker', { sub: 'worker-uid', user_id: 'worker-uid', email: 'worker@example.com' });
  const adminDb = client('admin', { sub: 'admin-uid', user_id: 'admin-uid', email: 'admin@example.com' });
  const staffDb = client('staff', { sub: 'staff-uid', user_id: 'staff-uid', email: 'staff@example.com' });
  const vacationDb = client('vacation', { sub: 'vacation-uid', user_id: 'vacation-uid', email: 'vacation@example.com' });
  const linkedDb = client('linked', { sub: 'linked-uid', user_id: 'linked-uid', email: 'linked@example.com' });
  const stationDb = client('station', { sub: 'station-uid', user_id: 'station-uid', email: 'station@example.com' });
  const credentialDb = client('credential', { sub: 'credential-uid', user_id: 'credential-uid', email: 'clock-test@example.com' });
  const recordId = `emp-1_${dateKey}`;
  const punchId = 'punch-clock-in-0001';
  const canonicalId = 'canonical-punch-0001';
  const punch = {
    id: punchId, type: 'clockIn', occurredAt: `${dateKey}T09:00:00`, occurredAtUtc: now.toISOString(),
    occurredAtEpochMs: epoch, timeZone: 'Europe/Lisbon', capturedAt: now.toISOString(), source: 'web',
    actorUid: 'worker-uid', actorEmail: 'worker@example.com', note: null, trustedServerTime: true,
    canonicalEventId: canonicalId
  };

  stage = 'personal task reads';
  console.log(stage);
  const [workerTasks, linkedTasks, taskDepartments] = await Promise.all([
    getDocs(query(collection(workerDb, 'tasks'), where(new FieldPath('assigneeAccess', 'worker@example.com'), '==', true))),
    getDocs(query(collection(linkedDb, 'tasks'), where(new FieldPath('assigneeAccess', 'linked@example.com'), '==', true))),
    getDocs(collection(linkedDb, 'taskDepartments')),
    expectDenied(() => getDoc(doc(workerDb, 'tasks', 'peer-task')), 'peer task read'),
    expectDenied(() => getDocs(collection(workerDb, 'tasks')), 'unfiltered task list')
  ]);
  if (workerTasks.size !== 1 || linkedTasks.size !== 1) throw new Error('linked colleague cannot query assigned tasks');
  if (taskDepartments.size !== 1) throw new Error('linked colleague cannot read task departments');
  const selfTaskCreate = writeBatch(workerDb);
  selfTaskCreate.set(doc(workerDb, 'tasks', 'worker-self-task'), {
    title: 'Personal follow-up', assigneeIds: ['emp-1'], assigneeAccess: { 'worker@example.com': true },
    assignees: [{ id: 'emp-1', name: 'Worker' }],
    createdBy: { uid: 'worker-uid', email: 'worker@example.com' }
  });
  await selfTaskCreate.commit();
  const forgedTaskCreate = writeBatch(workerDb);
  forgedTaskCreate.set(doc(workerDb, 'tasks', 'worker-forged-task'), {
    title: 'Forged assignment', assigneeIds: ['emp-1', 'emp-2'],
    assigneeAccess: { 'worker@example.com': true, 'peer@example.com': true },
    assignees: [{ id: 'emp-1', name: 'Worker' }, { id: 'emp-2', name: 'Station Worker' }],
    createdBy: { uid: 'worker-uid', email: 'worker@example.com' }
  });
  await expectDenied(() => forgedTaskCreate.commit(), 'task assignment to another colleague');

  const batch = writeBatch(workerDb);
  batch.set(doc(workerDb, 'attendance_events', canonicalId), canonicalData({
    id: canonicalId, recordId, action: 'punch', eventType: 'clockIn', targetEventId: punchId
  }));
  batch.set(doc(workerDb, 'attendance_records', recordId), {
    employeeId: 'emp-1', employeeName: 'Worker', dateKey, punches: [punch], corrections: [],
    voidedEventIds: [], workerAttestation: null, attestationHistory: [], reviewHistory: [],
    review: { status: null, note: null, reviewedAt: null, reviewedBy: null },
    createdAt: now.toISOString(), updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(),
    retainUntil: '2031-01-01', schemaVersion: 3, lastCanonicalEventId: canonicalId
  });
  stage = 'worker punch';
  console.log(stage);
  await batch.commit();
  if (!(await getDoc(doc(workerDb, 'attendance_records', recordId))).exists()) throw new Error('worker punch was not saved');
  const [staffEmployees] = await Promise.all([
    getDocs(collection(staffDb, 'employees')),
    expectDenied(() => getDoc(doc(workerDb, 'employees', 'emp-1')), 'ordinary employee raw own document read'),
    expectDenied(() => getDoc(doc(workerDb, 'employees', 'emp-2')), 'other employee private document read'),
    expectDenied(() => getDocs(collection(workerDb, 'employees')), 'employee directory list'),
    expectDenied(() => getDoc(doc(linkedDb, 'employees', 'emp-1')), 'linked account raw own document read'),
    expectDenied(() => getDoc(doc(linkedDb, 'employees', 'emp-2')), 'linked account other employee private document read'),
    expectDenied(() => getDocs(collection(linkedDb, 'employees')), 'linked account employee directory list')
  ]);
  if (staffEmployees.size < 2) throw new Error('authorized staff cannot read employee directory');
  await expectDenied(() => updateDoc(doc(workerDb, 'attendance_events', canonicalId), { reason: 'tampered' }), 'canonical update');
  await expectDenied(() => deleteDoc(doc(workerDb, 'attendance_records', recordId)), 'attendance delete');

  const credentialRecordId = `emp-2_${dateKey}`;
  const credentialPunchId = 'station-clock-in-0001';
  const credentialCanonicalId = 'canonical-station-0001';
  const credentialPunch = {
    ...punch, id: credentialPunchId, source: 'station', actorUid: 'credential-uid',
    actorEmail: 'clock-test@example.com', canonicalEventId: credentialCanonicalId
  };
  const credentialRecord = {
    employeeId: 'emp-2', employeeName: 'Station Worker', dateKey, punches: [credentialPunch], corrections: [],
    voidedEventIds: [], workerAttestation: null, attestationHistory: [], reviewHistory: [],
    review: { status: null, note: null, reviewedAt: null, reviewedBy: null },
    createdAt: now.toISOString(), updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(),
    retainUntil: '2031-01-01', schemaVersion: 3, lastCanonicalEventId: credentialCanonicalId
  };
  const forgedCredentialBatch = writeBatch(credentialDb);
  forgedCredentialBatch.set(doc(credentialDb, 'attendance_events', credentialCanonicalId), canonicalData({
    id: credentialCanonicalId, recordId: credentialRecordId, employeeId: 'emp-2', action: 'punch',
    eventType: 'clockIn', targetEventId: credentialPunchId, source: 'station',
    actorUid: 'credential-uid', actorEmail: 'clock-test@example.com'
  }));
  forgedCredentialBatch.set(doc(credentialDb, 'attendance_records', credentialRecordId), {
    ...credentialRecord,
    forgedManagerApproval: true
  });
  await expectDenied(() => forgedCredentialBatch.commit(), 'PIN credential forged field');

  const credentialBatch = writeBatch(credentialDb);
  credentialBatch.set(doc(credentialDb, 'attendance_events', credentialCanonicalId), canonicalData({
    id: credentialCanonicalId, recordId: credentialRecordId, employeeId: 'emp-2', action: 'punch',
    eventType: 'clockIn', targetEventId: credentialPunchId, source: 'station',
    actorUid: 'credential-uid', actorEmail: 'clock-test@example.com'
  }));
  const credentialRecordBatch = credentialBatch;
  credentialRecordBatch.set(doc(credentialDb, 'attendance_records', credentialRecordId), credentialRecord);
  stage = 'PIN credential punch';
  console.log(stage);
  await credentialRecordBatch.commit();
  stage = 'PIN directory status';
  console.log(stage);
  await updateDoc(doc(credentialDb, 'attendance_station_directory', 'emp-2'), {
    status: 'working', lastEventType: 'clockIn', lastOccurredAtEpochMs: epoch,
    updatedAtServer: serverTimestamp()
  });
  if (!(await getDoc(doc(credentialDb, 'attendance_records', credentialRecordId))).exists()) throw new Error('PIN credential punch was not saved');

  const manualCanonicalId = 'canonical-manual-0001';
  const manualPunchId = 'manual-clock-out-0001';
  const manualPunch = {
    ...punch, id: manualPunchId, type: 'clockOut', occurredAtEpochMs: null,
    occurredAtUtc: null, source: 'manual', actorUid: 'admin-uid', actorEmail: 'admin@example.com',
    note: 'Correção documentada', trustedServerTime: false, canonicalEventId: manualCanonicalId
  };
  const manualCorrection = {
    id: 'correction-0001', type: 'event-added', eventId: manualPunchId, reason: 'Correção documentada',
    actorUid: 'admin-uid', actorEmail: 'admin@example.com', recordedAt: now.toISOString(),
    status: 'needs-attention', canonicalEventId: manualCanonicalId
  };
  const manualBatch = writeBatch(adminDb);
  manualBatch.set(doc(adminDb, 'attendance_events', manualCanonicalId), canonicalData({
    id: manualCanonicalId, recordId, action: 'manual-punch', eventType: 'clockOut',
    targetEventId: manualPunchId, reason: 'Correção documentada', source: 'manual',
    actorUid: 'admin-uid', actorEmail: 'admin@example.com'
  }));
  manualBatch.update(doc(adminDb, 'attendance_records', recordId), {
    punches: [punch, manualPunch],
    corrections: [manualCorrection],
    workerAttestation: null,
    review: { status: 'needs-attention', note: 'Correção documentada', reviewedAt: null, reviewedBy: null },
    reviewHistory: [], updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(),
    lastCanonicalEventId: manualCanonicalId
  });
  stage = 'manual correction';
  console.log(stage);
  await manualBatch.commit();

  const overtimeId = 'overtime-0001';
  const overtimeCanonicalId = 'canonical-overtime-0001';
  const authorization = { id: 'audit-authorized-0001', event: 'authorized', actorUid: 'admin-uid', actorEmail: 'admin@example.com', recordedAt: now.toISOString(), canonicalEventId: overtimeCanonicalId };
  const overtimeBatch = writeBatch(adminDb);
  overtimeBatch.set(doc(adminDb, 'attendance_events', overtimeCanonicalId), canonicalData({
    id: overtimeCanonicalId, recordId: overtimeId, action: 'authorized', category: 'overtime',
    reason: 'Acréscimo transitório documentado', source: 'manual'
  }));
  overtimeBatch.set(doc(adminDb, 'overtime_records', overtimeId), {
    employeeId: 'emp-1', employeeName: 'Worker', dateKey, reason: 'Acréscimo transitório documentado',
    legalBasis: 'temporary-increase', workplace: 'Sede', compensationChoice: 'payment', status: 'authorized',
    authorizedAt: now.toISOString(), authorizedByUid: 'admin-uid', authorizedBy: 'admin@example.com',
    startEvent: null, endEvent: null, workerValidation: null, managerReview: null, compensatoryRest: null,
    auditTrail: [authorization],
    createdAt: now.toISOString(), updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(),
    retainUntil: '2031-01-01', schemaVersion: 2, lastCanonicalEventId: overtimeCanonicalId
  });
  stage = 'overtime authorization';
  console.log(stage);
  await overtimeBatch.commit();

  const startCanonicalId = 'canonical-overtime-start-0001';
  const startEpoch = Date.now();
  const startCapturedAt = new Date(startEpoch).toISOString();
  const startEvent = {
    id: 'overtime-start-event-0001', type: 'overtimeStart', occurredAt: `${dateKey}T09:00:00`,
    occurredAtUtc: startCapturedAt, occurredAtEpochMs: startEpoch, timeZone: 'Europe/Lisbon',
    capturedAt: startCapturedAt, source: 'web', actorUid: 'worker-uid', actorEmail: 'worker@example.com',
    note: null, trustedServerTime: true, canonicalEventId: startCanonicalId
  };
  const startBatch = writeBatch(workerDb);
  startBatch.set(doc(workerDb, 'attendance_events', startCanonicalId), canonicalData({
    id: startCanonicalId, recordId: overtimeId, action: 'started', category: 'overtime',
    eventType: 'overtimeStart', targetEventId: startEvent.id, eventEpochMs: startEpoch
  }));
  startBatch.update(doc(workerDb, 'overtime_records', overtimeId), {
    startEvent, status: 'in-progress', workerValidation: null,
    auditTrail: [authorization, { id: 'audit-started-0001', event: 'started', actorUid: 'worker-uid', actorEmail: 'worker@example.com', recordedAt: now.toISOString(), canonicalEventId: startCanonicalId }],
    updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(), lastCanonicalEventId: startCanonicalId
  });
  stage = 'overtime start';
  console.log(stage);
  await startBatch.commit();
  console.log('overtime start saved');
  if (!(await getDoc(doc(workerDb, 'overtime_records', overtimeId))).exists()) throw new Error('worker cannot read own overtime');
  await expectDenied(() => getDoc(doc(workerDb, 'overtime_records', 'peer-overtime-seeded')), 'other employee overtime read');

  stage = 'credential-private identity read';
  console.log(stage);
  if (!(await getDoc(doc(credentialDb, 'attendance_credentials', 'clock-test@example.com'))).exists()) throw new Error('credential cannot read its own mapping');
  if (!(await getDoc(doc(credentialDb, 'attendance_station_directory', 'emp-2'))).exists()) throw new Error('credential cannot read its own directory entry');

  const voidCanonicalId = 'canonical-void-0001';
  const voidCorrection = {
    id: 'correction-void-0001', type: 'event-voided', eventId: manualPunchId,
    reason: 'Marcação introduzida por engano', actorUid: 'admin-uid', actorEmail: 'admin@example.com',
    recordedAt: now.toISOString(), status: 'needs-attention', canonicalEventId: voidCanonicalId
  };
  const voidBatch = writeBatch(adminDb);
  voidBatch.set(doc(adminDb, 'attendance_events', voidCanonicalId), canonicalData({
    id: voidCanonicalId, recordId, action: 'event-voided', targetEventId: manualPunchId,
    reason: voidCorrection.reason, source: 'manual', actorUid: 'admin-uid', actorEmail: 'admin@example.com'
  }));
  voidBatch.update(doc(adminDb, 'attendance_records', recordId), {
    voidedEventIds: [manualPunchId],
    corrections: [manualCorrection, voidCorrection],
    workerAttestation: null,
    review: { status: 'needs-attention', note: voidCorrection.reason, reviewedAt: null, reviewedBy: null },
    updatedAt: now.toISOString(), updatedAtServer: serverTimestamp(), lastCanonicalEventId: voidCanonicalId
  });
  stage = 'admin void correction';
  console.log(stage);
  await voidBatch.commit();
  const voidedRecord = await getDoc(doc(adminDb, 'attendance_records', recordId));
  if (!voidedRecord.data()?.voidedEventIds?.includes(manualPunchId)) throw new Error('admin void was not saved');

  const privateNoteBatch = writeBatch(adminDb);
  privateNoteBatch.set(doc(adminDb, 'daily_notes', dateKey), { note: 'Private management note' });
  await privateNoteBatch.commit();
  if (!(await getDoc(doc(adminDb, 'daily_notes', dateKey))).exists()) throw new Error('admin cannot read daily note');
  await expectDenied(() => getDoc(doc(workerDb, 'daily_notes', dateKey)), 'private daily note read');

  stage = 'private vacation records';
  console.log(stage);
  const [adminVacations, staffVacations, vacationCenterVacations] = await Promise.all([
    getDocs(collection(adminDb, 'vacation_records')),
    getDocs(collection(staffDb, 'vacation_records')),
    getDocs(collection(vacationDb, 'vacation_records')),
    expectDenied(() => getDoc(doc(workerDb, 'vacation_records', 'own-vacation-seeded')), 'ordinary employee own detailed vacation read'),
    expectDenied(() => getDoc(doc(workerDb, 'vacation_records', 'peer-vacation-seeded')), 'other employee detailed vacation read'),
    expectDenied(() => getDocs(collection(workerDb, 'vacation_records')), 'ordinary employee vacation collection list')
  ]);
  if (adminVacations.size < 2) throw new Error('admin cannot read detailed vacation records');
  if (staffVacations.size < 2) throw new Error('authorized staff cannot read detailed vacation records');
  if (vacationCenterVacations.size < 2) throw new Error('Vacation Center account cannot read detailed vacation records');

  stage = 'vacation migration backup';
  console.log(stage);
  const migrationBackup = writeBatch(adminDb);
  migrationBackup.set(doc(adminDb, 'vacation_migration_backups', 'calendar-2026-v2'), {
    schemaVersion: 1,
    updateId: 'calendar-2026-v2',
    year: 2026,
    createdAt: now.toISOString(),
    employeeCount: 2,
    vacationRecordCount: 2,
    previousUpdateRecord: null,
    employees: [],
    vacationRecords: []
  });
  await migrationBackup.commit();
  if (!(await getDoc(doc(adminDb, 'vacation_migration_backups', 'calendar-2026-v2'))).exists()) {
    throw new Error('admin cannot create or read the migration rollback snapshot');
  }
  await Promise.all([
    expectDenied(() => getDoc(doc(workerDb, 'vacation_migration_backups', 'calendar-2026-v2')), 'worker migration backup read'),
    expectDenied(() => getDoc(doc(staffDb, 'vacation_migration_backups', 'calendar-2026-v2')), 'staff app migration backup read'),
    expectDenied(() => getDoc(doc(vacationDb, 'vacation_migration_backups', 'calendar-2026-v2')), 'Vacation Center migration backup read')
  ]);

  stage = 'safe employee self-service records';
  console.log(stage);
  const ownVacationPath = ['employee_self_service', 'emp-1', 'vacation_records', 'emp-1__2026-09-14__2026-09-18'];
  const peerVacationPath = ['employee_self_service', 'emp-2', 'vacation_records', 'emp-2__2026-09-21__2026-09-25'];
  const [workerProfile, linkedProfile, workerVacations, linkedVacations, adminProfiles, staffProfiles] = await Promise.all([
    getDoc(doc(workerDb, 'employee_self_service', 'emp-1')),
    getDoc(doc(linkedDb, 'employee_self_service', 'emp-1')),
    getDocs(collection(workerDb, 'employee_self_service', 'emp-1', 'vacation_records')),
    getDocs(collection(linkedDb, 'employee_self_service', 'emp-1', 'vacation_records')),
    getDocs(collection(adminDb, 'employee_self_service')),
    getDocs(collection(staffDb, 'employee_self_service')),
    expectDenied(() => getDoc(doc(workerDb, 'employee_self_service', 'emp-2')), 'other employee self-service profile read'),
    expectDenied(() => getDocs(collection(workerDb, 'employee_self_service')), 'self-service profile list'),
    expectDenied(() => getDoc(doc(workerDb, ...peerVacationPath)), 'other employee safe vacation read'),
    expectDenied(() => getDocs(collection(workerDb, 'employee_self_service', 'emp-2', 'vacation_records')), 'other employee safe vacation list'),
    expectDenied(() => getDoc(doc(stationDb, 'employee_self_service', 'emp-1')), 'station self-service profile read'),
    expectDenied(() => getDoc(doc(stationDb, ...ownVacationPath)), 'station self-service vacation read')
  ]);
  if (!workerProfile.exists() || !linkedProfile.exists()) throw new Error('linked account cannot read its safe profile');
  if (workerVacations.size !== 1 || linkedVacations.size !== 1) throw new Error('linked account cannot list its safe vacations');
  if (adminProfiles.size < 2 || staffProfiles.size < 2) throw new Error('management cannot read self-service profiles');
  if (Object.hasOwn(workerVacations.docs[0].data(), 'note')) throw new Error('safe vacation unexpectedly contains a private note');
  if (workerProfile.data()?.vacationBalance?.remainingDays !== 14) throw new Error('worker cannot read own vacation balance');

  await updateDoc(doc(staffDb, 'employee_self_service', 'emp-1'), {
    name: 'Worker safe profile', updatedAtServer: serverTimestamp()
  });
  await updateDoc(doc(staffDb, ...ownVacationPath), {
    status: 'approved', updatedAtServer: serverTimestamp()
  });

  stage = 'archived self-service lifecycle';
  console.log(stage);
  await updateDoc(doc(adminDb, 'employee_self_service', 'emp-1'), {
    name: 'Inactive profile', staffNumber: null, email: null, phone: null,
    department: null, position: null, hireDate: null, employmentType: null,
    workDays: [], shifts: {}, vacationBalance: null, active: false, updatedAtServer: serverTimestamp()
  });
  await Promise.all([
    expectDenied(() => getDoc(doc(workerDb, 'employee_self_service', 'emp-1')), 'inactive own profile read'),
    expectDenied(() => getDoc(doc(workerDb, ...ownVacationPath)), 'inactive own vacation read'),
    expectDenied(() => getDocs(collection(workerDb, 'employee_self_service', 'emp-1', 'vacation_records')), 'inactive own vacation list'),
    expectDenied(() => deleteDoc(doc(adminDb, 'employee_self_service', 'emp-1')), 'self-service parent deletion')
  ]);
  await updateDoc(doc(adminDb, 'employee_self_service', 'emp-1'), {
    name: 'Worker safe profile', staffNumber: 1, email: 'worker@example.com',
    department: 'Operations', position: 'Host', hireDate: '2024-01-08',
    employmentType: 'Permanent', workDays: [1, 2, 3, 4, 5],
    shifts: { default: '09:00-18:00' },
    vacationBalance: { year: 2026, allowanceDays: 22, takenDays: 5, plannedDays: 3, recordedDays: 8, remainingDays: 14, schemaVersion: 1 },
    active: true, updatedAtServer: serverTimestamp()
  });
  if (!(await getDoc(doc(workerDb, 'employee_self_service', 'emp-1'))).exists()) {
    throw new Error('reactivated linked account cannot read its safe profile');
  }
  if (!(await getDoc(doc(workerDb, ...ownVacationPath))).exists()) {
    throw new Error('reactivated linked account cannot read its safe vacation');
  }

  const workerProfileWrite = writeBatch(workerDb);
  workerProfileWrite.update(doc(workerDb, 'employee_self_service', 'emp-1'), { name: 'Forged worker name' });
  await expectDenied(() => workerProfileWrite.commit(), 'worker self-service profile write');

  const forgedSafeVacation = writeBatch(adminDb);
  forgedSafeVacation.set(doc(adminDb, 'employee_self_service', 'emp-1', 'vacation_records', 'forged-private-note'), {
    startDate: '2026-10-01', endDate: '2026-10-02', type: 'vacation', status: 'approved',
    dayCountMode: 'workdays', schemaVersion: 1, note: 'must stay private', updatedAtServer: serverTimestamp()
  });
  await expectDenied(() => forgedSafeVacation.commit(), 'private note in safe vacation projection');

  stage = 'personal data correction requests';
  console.log(stage);
  const [workerCorrections, linkedCorrections, adminCorrections, staffCorrections] = await Promise.all([
    getDocs(query(collection(workerDb, 'employee_data_correction_requests'), where('employeeId', '==', 'emp-1'))),
    getDocs(query(collection(linkedDb, 'employee_data_correction_requests'), where('employeeId', '==', 'emp-1'))),
    getDocs(collection(adminDb, 'employee_data_correction_requests')),
    getDocs(collection(staffDb, 'employee_data_correction_requests')),
    expectDenied(() => getDoc(doc(workerDb, 'employee_data_correction_requests', 'peer-correction-seeded')), 'peer correction request read'),
    expectDenied(() => getDocs(collection(workerDb, 'employee_data_correction_requests')), 'unfiltered correction request list'),
    expectDenied(() => getDoc(doc(stationDb, 'employee_data_correction_requests', 'own-correction-seeded')), 'station correction request read')
  ]);
  if (workerCorrections.size !== 1 || linkedCorrections.size !== 1) throw new Error('linked colleague cannot list own correction requests');
  if (adminCorrections.size < 2 || staffCorrections.size < 2) throw new Error('management cannot list correction requests');

  const createOwnCorrection = writeBatch(workerDb);
  createOwnCorrection.set(doc(workerDb, 'employee_data_correction_requests', 'worker-created-correction'), {
    employeeId: 'emp-1', requesterUid: 'worker-uid', category: 'attendance', referenceDate: dateKey,
    description: 'The recorded arrival time should be reviewed.', status: 'submitted',
    resolutionNote: null, reviewedByUid: null, resolvedAtServer: null,
    createdAtServer: serverTimestamp(), updatedAtServer: serverTimestamp()
  });
  await createOwnCorrection.commit();

  const forgePeerCorrection = writeBatch(workerDb);
  forgePeerCorrection.set(doc(workerDb, 'employee_data_correction_requests', 'forged-peer-correction'), {
    employeeId: 'emp-2', requesterUid: 'worker-uid', category: 'profile', referenceDate: null,
    description: 'Attempt to create a request for another colleague.', status: 'submitted',
    resolutionNote: null, reviewedByUid: null, resolvedAtServer: null,
    createdAtServer: serverTimestamp(), updatedAtServer: serverTimestamp()
  });
  await expectDenied(() => forgePeerCorrection.commit(), 'correction request for another employee');
  await expectDenied(() => updateDoc(doc(workerDb, 'employee_data_correction_requests', 'own-correction-seeded'), {
    status: 'resolved', resolutionNote: 'Forged', reviewedByUid: 'worker-uid',
    resolvedAtServer: serverTimestamp(), updatedAtServer: serverTimestamp()
  }), 'worker correction request review');

  await updateDoc(doc(staffDb, 'employee_data_correction_requests', 'own-correction-seeded'), {
    status: 'in-review', resolutionNote: null, reviewedByUid: 'staff-uid',
    resolvedAtServer: null, updatedAtServer: serverTimestamp()
  });
  await updateDoc(doc(adminDb, 'employee_data_correction_requests', 'own-correction-seeded'), {
    status: 'resolved', resolutionNote: 'The profile was corrected.', reviewedByUid: 'admin-uid',
    resolvedAtServer: serverTimestamp(), updatedAtServer: serverTimestamp()
  });
  await expectDenied(() => updateDoc(doc(staffDb, 'employee_data_correction_requests', 'peer-correction-seeded'), {
    description: 'Management must not rewrite the original request.', status: 'in-review',
    resolutionNote: null, reviewedByUid: 'staff-uid', resolvedAtServer: null,
    updatedAtServer: serverTimestamp()
  }), 'management correction request content rewrite');
  await expectDenied(() => deleteDoc(doc(adminDb, 'employee_data_correction_requests', 'own-correction-seeded')), 'correction request deletion');

  stage = 'limited schedule directory';
  console.log(stage);
  const scheduleEntry = {
    name: 'Worker', department: 'Operations', workDays: [1, 2, 3, 4, 5],
    shifts: { default: '09:00-18:00' }, overrides: { [dateKey]: 'Working' },
    availabilityPeriods: [], schemaVersion: 1, updatedAtServer: serverTimestamp()
  };
  const scheduleBatch = writeBatch(adminDb);
  scheduleBatch.set(doc(adminDb, 'schedule_directory', 'emp-1'), scheduleEntry);
  await scheduleBatch.commit();
  if (!(await getDoc(doc(workerDb, 'schedule_directory', 'emp-1'))).exists()) throw new Error('worker cannot read limited schedule directory');
  if (!(await getDoc(doc(linkedDb, 'schedule_directory', 'emp-1'))).exists()) throw new Error('linked self-service account cannot read limited schedule directory');
  await updateDoc(doc(staffDb, 'schedule_directory', 'emp-1'), {
    name: 'Worker updated by staff', updatedAtServer: serverTimestamp()
  });
  await expectDenied(() => getDoc(doc(stationDb, 'schedule_directory', 'emp-1')), 'station schedule directory read');

  const workerScheduleWrite = writeBatch(workerDb);
  workerScheduleWrite.set(doc(workerDb, 'schedule_directory', 'forged-worker'), scheduleEntry);
  await expectDenied(() => workerScheduleWrite.commit(), 'worker schedule directory write');

  const privateFieldBatch = writeBatch(adminDb);
  privateFieldBatch.set(doc(adminDb, 'schedule_directory', 'forged-private'), {
    ...scheduleEntry, email: 'private@example.com', updatedAtServer: serverTimestamp()
  });
  await expectDenied(() => privateFieldBatch.commit(), 'private schedule directory field');

  stage = 'station restricted reads';
  console.log(stage);
  return { passed: true };
  } catch (error) {
    throw new Error(`${stage}: ${error?.stack || error}`);
  }
}

run().then((result) => {
  window.__firestoreRulesResult = result;
  document.title = 'PASS firestore rules';
}).catch((error) => {
  window.__firestoreRulesResult = { passed: false, error: error?.stack || String(error) };
  document.title = 'FAIL firestore rules';
});
</script>
